name: Daily Streak Keeper

on:
  schedule:
    - cron: '0 7,11,15,19,23 * * *' # Runs multiple times/day for randomization
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Streak Log and Commit
        run: |
          # Check if today is already logged (prevent duplicate runs)
          TODAY=$(date +'%a %b %d')
          if grep -q "$TODAY" streak_log.txt; then
            echo "Already committed today ($TODAY). Skipping."
            exit 0
          fi

          # Randomization Logic
          HOUR=$(date +%H)
          # 20% chance to run in any given slot, unless it's the last slot (23h) where we force it.
          # Random number 0-4 (5 possibilities). If 0, run.
          if [ "$HOUR" -lt 23 ] && [ $((RANDOM % 5)) -ne 0 ]; then
             echo "Randomly skipping this time slot. Will try again later."
             exit 0
          fi

          # Add a random delay (0-15 minutes) to vary the exact timestamp
          SLEEP_SEC=$((RANDOM % 900))
          echo "Sleeping for $SLEEP_SEC seconds..."
          sleep $SLEEP_SEC

          git config --global user.name "samarb2"
          git config --global user.email "samarb2@uic.edu"

          # Generate 1..5 commits with a non-linear weighted distribution.
          # Squaring a uniform 30-bit random value biases toward lower counts,
          # making 4-5 significantly less frequent than 1-3.
          RAND_MAX=1073741823
          RAND_30=$(((RANDOM << 15) | RANDOM))
          SKEWED=$((RAND_30 * RAND_30 / RAND_MAX))
          COMMIT_COUNT=$((1 + (SKEWED * 5 / RAND_MAX)))
          if [ "$COMMIT_COUNT" -gt 5 ]; then
            COMMIT_COUNT=5
          fi
          echo "Will create $COMMIT_COUNT keep-alive commit(s)."

          for i in $(seq 1 "$COMMIT_COUNT"); do
            echo "Keep alive $i: $(date -u +'%a %b %d %H:%M:%S UTC %Y')" >> streak_log.txt
            git add streak_log.txt

            if [[ -n $(git status -s) ]]; then
              git commit -m "chore: daily streak keep-alive ($i/$COMMIT_COUNT)"
              git push
            else
              echo "No changes to commit for commit $i/$COMMIT_COUNT"
            fi

            if [ "$i" -lt "$COMMIT_COUNT" ]; then
              NEXT_DELAY_SEC=$((30 + (RANDOM % 271)))
              echo "Sleeping $NEXT_DELAY_SEC seconds before next commit..."
              sleep "$NEXT_DELAY_SEC"
            fi
          done
