name: Daily Streak Keeper

on:
  schedule:
    - cron: '0 12 * * *' # Runs every day at 12:00 UTC
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "samarb2"
          git config --global user.email "samarb2@uic.edu"

      - name: Commit 1
        run: |
          echo "Keep alive #1: $(date)" >> streak_log.txt
          git add streak_log.txt
          git commit -m "chore: daily streak keep-alive #1"

      - name: Commit 2
        run: |
          echo "Keep alive #2: $(date)" >> streak_log.txt
          git add streak_log.txt
          git commit -m "chore: daily streak keep-alive #2"

      - name: Commit 3
        run: |
          echo "Keep alive #3: $(date)" >> streak_log.txt
          git add streak_log.txt
          git commit -m "chore: daily streak keep-alive #3"

      - name: Push all commits
        run: git push
